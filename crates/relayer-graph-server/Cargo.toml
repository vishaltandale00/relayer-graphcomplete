[package]
name = "relayer-graph-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
relayer-graph-core = { path = "../relayer-graph-core" }
relayer-telemetry-capability = { path = "../relayer-telemetry-capability" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(ladybug_qualification)'.dependencies]
lbug = { version = "=0.18.0", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ladybug_qualification)'] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
