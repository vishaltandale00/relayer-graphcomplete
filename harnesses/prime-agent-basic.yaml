schemaVersion: 1
name: prime-agent-basic
implementation: prime.agent
implementationVersion: 1
revision: 8
complete:
  agentAuthored: true
permissionBindings:
  ask:
    boundary: workspace-write@1
    reviewer: user
    networkAccessEnabled: true
  auto:
    boundary: workspace-write@1
    reviewer: automatic
    networkAccessEnabled: true
  full: {}
modelRules:
  allow:
    - adapterId: openai-api
      modelIdRegex: ".*"
    - adapterId: anthropic-api
      modelIdRegex: ".*"
    - adapterId: openrouter
      modelIdRegex: ".*"
    - adapterId: vercel-ai-router
      modelIdRegex: ".*"
  deny: []
executionAccessContracts: [secret@1]
modelDefaults:
  familyPolicy:
    id: prime-default-family
    version: 1
graphCapabilityProfile:
  search: query-v1
  preview: enabled
settings:
  personalPresentationVersion: personal-presentation-v4
  thinkingLevel: medium
  rlmMaxDepth: 1
  prewarmIpythonKernel: true
