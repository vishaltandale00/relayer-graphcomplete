schemaVersion: 1
name: prime-agent
implementation: prime.agent
implementationVersion: 1
revision: 2
permissionBindings:
  ask:
    boundary: workspace-write@1
    reviewer: user
    networkAccessEnabled: true
  auto:
    boundary: workspace-write@1
    reviewer: automatic
    networkAccessEnabled: true
  full: {}
modelRules:
  allow:
    - adapterId: codex-subscription
      modelIdRegex: ".*"
    - adapterId: claude-subscription
      modelIdRegex: ".*"
    - adapterId: openai-api
      modelIdRegex: ".*"
    - adapterId: anthropic-api
      modelIdRegex: ".*"
    - adapterId: openrouter
      modelIdRegex: ".*"
    - adapterId: vercel-ai-router
      modelIdRegex: ".*"
  deny: []
executionAccessContracts: [managed-runtime@1, secret@1]
settings:
  thinkingLevel: medium
  rlmMaxDepth: 1
  prewarmIpythonKernel: true
