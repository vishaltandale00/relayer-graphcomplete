name: Windows Desktop Candidate

on:
  workflow_dispatch:
    inputs:
      force_native_rebuild:
        description: Bypass binary reuse to qualify dependency/compiler cache behavior
        type: boolean
        default: false
        required: false
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]

concurrency:
  group: windows-desktop-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Require protected main source
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Require exact-source main CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node desktop/release/main-ci-check.mjs

  qualify:
    name: Qualify Windows native package
    needs: validate
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && needs.validate.result == 'success') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'windows-qualification'))) }}
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      RELAYER_DESKTOP_TARGET: windows-x64
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 2G
      RELAYER_WINDOWS_NATIVE_CACHE: ${{ inputs.force_native_rebuild && '0' || '1' }}
    steps:
      - name: Initialize Windows native cache paths
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "SCCACHE_DIR=$env:RUNNER_TEMP/rwc" >> $env:GITHUB_ENV
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64
      - run: node scripts/check-node-version.mjs
      - run: npm ci
      - name: Verify packaged ASAR contract before native compilation
        run: node node_modules/vitest/vitest.mjs run test/windows-candidate.test.mjs -t "canonicalizes packaged ASAR inventory"
      - name: Verify pinned Windows telemetry CLI startup
        env:
          SENTRY_CLI_BINARY: ${{ github.workspace }}\node_modules\@sentry\cli-win32-x64\bin\sentry-cli.exe
        run: node -e "const {spawnSync}=require('node:child_process'); const result=spawnSync(process.env.SENTRY_CLI_BINARY,['--version'],{stdio:'inherit'}); if(result.error)throw result.error; if(result.status!==0)process.exit(result.status ?? 1)"
      - name: Verify Windows signature runtime
        shell: pwsh
        run: node scripts/check-windows-signature-runtime.mjs
      - name: Verify native Cargo EXE and PDB paths
        run: node scripts/check-windows-rust-symbols.mjs
      - name: Verify Windows native cache transfer and handoff
        run: node node_modules/vitest/vitest.mjs run test/windows-native-cache.test.mjs test/desktop-telemetry-release-artifacts.test.mjs
      - name: Record native cache decision and toolchains
        shell: pwsh
        run: |
          # Existing signed/native caches authenticate macOS arm64 only. No
          # Windows qualification receipt has been published; compile fresh.
          "Cold Windows qualification: no compatible trusted native cache." >> $env:GITHUB_STEP_SUMMARY
          rustc -vV
          cmake --version
          perl -v
        if: ${{ github.event_name == 'pull_request' }}
      - name: Prepare pinned static native sources
        shell: pwsh
        run: |
          cargo fetch --locked --target x86_64-pc-windows-msvc
          npm run ladybug:source -- fetch --cache "$env:RUNNER_TEMP/ladybug-cache"
          npm run ladybug:source -- prepare --cache "$env:RUNNER_TEMP/ladybug-cache" --output "$env:RUNNER_TEMP/ladybug-prepared" --target x86_64-pc-windows-msvc
        if: ${{ github.event_name == 'pull_request' }}
      - name: Verify unsigned package and native lifecycle
        shell: pwsh
        run: node scripts/capture-ladybug-packaged-lifecycle.mjs --source-output "$env:RUNNER_TEMP/ladybug-prepared" --source-commit "${{ github.sha }}" --receipt-output "$env:RUNNER_TEMP/windows-native-receipt.json"
        if: ${{ github.event_name == 'pull_request' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/windows-native-receipt.json
          if-no-files-found: error
          retention-days: 90
        if: ${{ github.event_name == 'pull_request' }}
      - name: Identify Windows native build inputs
        id: native-plan
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node desktop/release/windows-native-build.mjs plan
      - name: Restore verified Windows native output
        id: native-restore
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node desktop/release/windows-native-build.mjs restore
      - name: Restore locked native source downloads
        id: native-downloads
        if: ${{ github.event_name == 'workflow_dispatch' && steps.native-restore.outputs.hit != 'true' && steps.native-plan.outputs.cache_eligible == 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/relayer-ladybug-source-cache-v1
          key: windows-release-cargo-v1-${{ steps.native-plan.outputs.native_identity }}-${{ steps.native-plan.outputs.dependency_identity }}
          restore-keys: windows-release-cargo-v1-${{ steps.native-plan.outputs.native_identity }}-
          download-chunk-timeout-minutes: 1
      - name: Restore verified native preparation
        id: native-preparation
        if: ${{ github.event_name == 'workflow_dispatch' && steps.native-restore.outputs.hit != 'true' && steps.native-plan.outputs.cache_eligible == 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/rwn
          key: windows-release-preparation-v1-${{ steps.native-plan.outputs.native_identity }}-${{ github.sha }}
          restore-keys: windows-release-preparation-v1-${{ steps.native-plan.outputs.native_identity }}-
          download-chunk-timeout-minutes: 1
      - name: Restore native compiler objects
        id: native-objects
        if: ${{ github.event_name == 'workflow_dispatch' && steps.native-restore.outputs.hit != 'true' && steps.native-plan.outputs.cache_eligible == 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/rwc
          key: windows-release-objects-v1-${{ steps.native-plan.outputs.native_identity }}-${{ github.sha }}
          restore-keys: windows-release-objects-v1-${{ steps.native-plan.outputs.native_identity }}-
          download-chunk-timeout-minutes: 1
      - name: Set up pinned Windows compiler cache
        if: ${{ github.event_name == 'workflow_dispatch' && steps.native-restore.outputs.hit != 'true' && steps.native-plan.outputs.cache_eligible == 'true' }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
          disable_annotations: true
      - name: Qualify release native inputs once
        id: native-qualification
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node desktop/release/windows-native-build.mjs qualify
      - name: Preserve qualified Windows native inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.native-qualification.outputs.artifact_name }}
          path: ${{ steps.native-qualification.outputs.artifact_directory }}
          if-no-files-found: error
          retention-days: 30
      - name: Preserve release-profile lifecycle receipt
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-release-qualification.json
          if-no-files-found: error
          retention-days: 90
      - name: Record Windows compiler cache statistics
        if: ${{ always() && github.event_name == 'workflow_dispatch' && steps.native-restore.outputs.hit != 'true' }}
        continue-on-error: true
        shell: pwsh
        run: if ($env:SCCACHE_PATH) { & $env:SCCACHE_PATH --show-stats; & $env:SCCACHE_PATH --show-stats --stats-format json | Out-File -Encoding utf8 "$env:RUNNER_TEMP/windows-sccache-stats.json" }
      - name: Preserve Windows compiler cache statistics
        if: ${{ always() && github.event_name == 'workflow_dispatch' && steps.native-restore.outputs.hit != 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-compiler-statistics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-sccache-stats.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save locked native source downloads
        if: ${{ success() && github.event_name == 'workflow_dispatch' && steps.native-restore.outputs.hit != 'true' && steps.native-plan.outputs.cache_eligible == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/relayer-ladybug-source-cache-v1
          key: windows-release-cargo-v1-${{ steps.native-plan.outputs.native_identity }}-${{ steps.native-plan.outputs.dependency_identity }}
      - name: Save verified native preparation
        if: ${{ success() && github.event_name == 'workflow_dispatch' && steps.native-restore.outputs.hit != 'true' && steps.native-plan.outputs.cache_eligible == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/rwn
          key: windows-release-preparation-v1-${{ steps.native-plan.outputs.native_identity }}-${{ github.sha }}
      - name: Save native compiler objects
        if: ${{ success() && github.event_name == 'workflow_dispatch' && steps.native-restore.outputs.hit != 'true' && steps.native-plan.outputs.cache_eligible == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/rwc
          key: windows-release-objects-v1-${{ steps.native-plan.outputs.native_identity }}-${{ github.sha }}
    outputs:
      native_identity: ${{ steps.native-plan.outputs.identity }}

  package:
    name: Sign Windows x64 Preview
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [ validate, qualify ]
    runs-on: windows-2025
    # Native inputs are qualified in the producer job. This budget covers fresh
    # signing, installer verification, and mandatory symbol upload.
    timeout-minutes: 120
    environment: desktop-production-windows
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RELAYER_DESKTOP_TARGET: windows-x64
      RELAYER_DESKTOP_SOURCE_COMMIT: ${{ github.sha }}
      RELAYER_DESKTOP_CANDIDATE_RUN_ID: ${{ github.run_id }}
      RELAYER_DESKTOP_CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
      RELAYER_DESKTOP_UPDATE_BASE_URL: https://updates.relayerlabs.ai/desktop/windows/x64
      RELAYER_WINDOWS_SIGNING_ENDPOINT: https://eus.codesigning.azure.net/
      RELAYER_WINDOWS_SIGNING_ACCOUNT: relayercodesigning
      RELAYER_WINDOWS_CERTIFICATE_PROFILE: ${{ vars.RELAYER_WINDOWS_CERTIFICATE_PROFILE }}
      RELAYER_WINDOWS_PUBLISHER_NAME: ${{ vars.RELAYER_WINDOWS_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64
      - run: node scripts/check-node-version.mjs
      - run: npm ci
      - name: Verify packaged ASAR contract before native compilation
        run: node node_modules/vitest/vitest.mjs run test/windows-candidate.test.mjs -t "canonicalizes packaged ASAR inventory"
      - name: Verify pinned Windows telemetry CLI startup
        env:
          SENTRY_CLI_BINARY: ${{ github.workspace }}\node_modules\@sentry\cli-win32-x64\bin\sentry-cli.exe
        run: node -e "const {spawnSync}=require('node:child_process'); const result=spawnSync(process.env.SENTRY_CLI_BINARY,['--version'],{stdio:'inherit'}); if(result.error)throw result.error; if(result.status!==0)process.exit(result.status ?? 1)"
      - name: Verify Windows signature runtime
        shell: pwsh
        run: node scripts/check-windows-signature-runtime.mjs
      - name: Verify native Cargo EXE and PDB paths
        run: node scripts/check-windows-rust-symbols.mjs
      - name: Verify Windows native cache transfer and handoff
        run: node node_modules/vitest/vitest.mjs run test/windows-native-cache.test.mjs test/desktop-telemetry-release-artifacts.test.mjs
      - name: Require signing configuration
        shell: pwsh
        run: |
          foreach ($name in @("AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID", "RELAYER_WINDOWS_CERTIFICATE_PROFILE", "RELAYER_WINDOWS_PUBLISHER_NAME")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing variable: $name" }
          }
      - name: Adopt qualified release native before signing login
        shell: pwsh
        run: node desktop/release/windows-native-build.mjs adopt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELAYER_WINDOWS_NATIVE_IDENTITY: ${{ needs.qualify.outputs.native_identity }}
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate Artifact Signing resource
        run: az account get-access-token --resource https://codesigning.azure.net --output none
      - name: Build and verify signed installer
        shell: pwsh
        run: npm run desktop:dist:preview -- --use-windows-native "$env:RUNNER_TEMP/windows-release-native.json"
      - name: Upload version-matched telemetry
        env:
          RELAYER_DESKTOP_RELEASE: "1"
          RELAYER_DESKTOP_CHANNEL: preview
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_CLI_BINARY: ${{ github.workspace }}\node_modules\@sentry\cli-win32-x64\bin\sentry-cli.exe
          SENTRY_ORG: relayer-labs-llc
          SENTRY_PROJECT: graphcomplete-desktop
        run: node desktop/release/telemetry-artifacts.mjs
      - name: Upload sealed signed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relayer-desktop-preview-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            desktop/dist/Relayer-*.exe
            desktop/dist/Relayer-*.exe.blockmap
            desktop/dist/beta.yml
            desktop/dist/Relayer-*-SHA256SUMS.txt
            desktop/dist/Relayer-*-RELEASE.json
            desktop/dist/telemetry/**
