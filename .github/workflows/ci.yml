name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - integration/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan affected verification
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      mode: ${{ steps.plan.outputs.mode }}
      rust: ${{ steps.plan.outputs.rust }}
      typescript: ${{ steps.plan.outputs.typescript }}
      vitest: ${{ steps.plan.outputs.vitest }}
      python: ${{ steps.plan.outputs.python }}
      receipts: ${{ steps.plan.outputs.receipts }}
      prd: ${{ steps.plan.outputs.prd }}
      packaging: ${{ steps.plan.outputs.packaging }}
    steps:
      - name: Check out source and base history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify Node toolchain
        run: node scripts/check-node-version.mjs
      - name: Derive affected-module plan
        id: plan
        run: |
          mode="$(node scripts/ci/select-mode.mjs)"
          node scripts/ci/plan-affected.mjs \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --mode "$mode"

  quick:
    name: Quick deterministic checks
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node dependencies with evidence
        uses: ./.github/actions/setup-node-dependencies
      - name: Verify Node toolchain
        run: node scripts/check-node-version.mjs
      - name: Formatting, generated files, and affected typechecks
        run: node scripts/ci/run-chapter.mjs quick
        env:
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan }}

  rust:
    name: Rust checks and fresh tests
    needs: [plan, quick]
    if: ${{ needs.quick.result == 'success' && needs.plan.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node dependencies with evidence
        uses: ./.github/actions/setup-node-dependencies
      - name: Identify Rust cache inputs
        id: rust-toolchain
        run: |
          rustc --version --verbose
          echo "release=$(rustc --version --verbose | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "host=$(rustc --version --verbose | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
      - name: Start Rust dependency cache timing
        id: rust-dependency-cache-timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust dependency downloads
        id: rust-dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: rust-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.release }}-${{ steps.rust-toolchain.outputs.host }}-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.release }}-${{ steps.rust-toolchain.outputs.host }}-v1-
      - name: Record Rust dependency cache status
        env:
          CACHE_HIT: ${{ steps.rust-dependency-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.rust-dependency-cache.outputs.cache-primary-key }}
          STARTED: ${{ steps.rust-dependency-cache-timing.outputs.started }}
        run: |
          elapsed=$(($(date +%s) - STARTED))
          echo "### Rust dependency cache" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact hit: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restore: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- Primary key: $CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up sccache compiler cache
        id: sccache-setup
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true
      - name: Start sccache service
        id: sccache-start
        if: ${{ steps.sccache-setup.outcome == 'success' }}
        continue-on-error: true
        env:
          SCCACHE_CLIENT_SIDE: "1"
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_RW_MODE: READ_WRITE
          SCCACHE_GHA_VERSION: relayer-rust-line-tables-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.release }}-${{ steps.rust-toolchain.outputs.host }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
        run: |
          if "$SCCACHE_PATH" --start-server; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Selected Rust compilation, checks, and tests
        run: node scripts/ci/run-chapter.mjs rust
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan }}
          RELAYER_SCCACHE_ENABLED: ${{ steps.sccache-start.outputs.enabled }}
          RUSTC_WRAPPER: ${{ github.workspace }}/scripts/ci/sccache-wrapper.sh
          SCCACHE_CLIENT_SIDE: "1"
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_RW_MODE: READ_WRITE
          SCCACHE_GHA_VERSION: relayer-rust-line-tables-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.release }}-${{ steps.rust-toolchain.outputs.host }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      - name: Report sccache compiler statistics
        if: ${{ always() }}
        continue-on-error: true
        env:
          SCCACHE_SETUP_OUTCOME: ${{ steps.sccache-setup.outcome }}
          SCCACHE_START_OUTCOME: ${{ steps.sccache-start.outcome }}
        run: |
          stats_text="$RUNNER_TEMP/sccache-stats.txt"
          stats_json="$RUNNER_TEMP/sccache-stats.json"
          append_summary() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          append_summary "### Rust sccache canary"
          append_summary "- Setup: $SCCACHE_SETUP_OUTCOME"
          append_summary "- Service start: $SCCACHE_START_OUTCOME"
          append_summary "- Cache access: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'disabled (fork)' || 'read-write' }}"
          if [ "$SCCACHE_SETUP_OUTCOME" = "success" ] &&
             [ "$SCCACHE_START_OUTCOME" = "success" ] &&
             [ -n "${SCCACHE_PATH:-}" ]; then
            set +e
            "$SCCACHE_PATH" --show-stats 2>&1 | tee "$stats_text"
            stats_status=${PIPESTATUS[0]}
            "$SCCACHE_PATH" --show-stats --stats-format json > "$stats_json"
            json_status=$?
            set -e
            append_summary "- Text statistics: exit $stats_status"
            append_summary "- JSON statistics: exit $json_status"
            append_summary '```text'
            cat "$stats_text" >> "$GITHUB_STEP_SUMMARY"
            append_summary '```'
          else
            append_summary "- Statistics: unavailable; compilation fell back to direct rustc"
          fi
          append_summary "Compiler objects are untrusted acceleration only; cache reuse never substitutes for fresh test execution."
      - name: Upload sccache compiler statistics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sccache-stats-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sccache-stats.txt
            ${{ runner.temp }}/sccache-stats.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Save trusted Rust dependency downloads
        if: ${{ github.event_name == 'push' && success() && steps.rust-dependency-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.rust-dependency-cache.outputs.cache-primary-key }}

  typescript:
    name: TypeScript builds
    needs: [plan, quick]
    if: ${{ needs.quick.result == 'success' && needs.plan.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node dependencies with evidence
        uses: ./.github/actions/setup-node-dependencies
      - name: Build selected TypeScript workspaces
        run: node scripts/ci/run-chapter.mjs typescript
        env:
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan }}

  vitest:
    name: Fresh deterministic Vitest portfolio
    needs: [plan, quick]
    if: ${{ needs.quick.result == 'success' && needs.plan.outputs.vitest == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node dependencies with evidence
        uses: ./.github/actions/setup-node-dependencies
      - name: Identify Rust cache inputs
        id: rust-toolchain
        run: |
          rustc --version --verbose
          echo "release=$(rustc --version --verbose | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "host=$(rustc --version --verbose | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
      - name: Start Rust cache timing
        id: rust-cache-timing
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Restore read-only Vitest runtime compilation acceleration
        id: rust-cache
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-affected-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.release }}-${{ steps.rust-toolchain.outputs.host }}-debug-all-features-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-affected-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.release }}-${{ steps.rust-toolchain.outputs.host }}-debug-all-features-v1-
      - name: Record Vitest Rust cache status
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          STARTED: ${{ steps.rust-cache-timing.outputs.started }}
        run: |
          elapsed=$(($(date +%s) - STARTED))
          echo "### Vitest Rust compilation cache" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact hit: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restore: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          echo "Cache contents accelerate runtime compilation only; every mapped test runs freshly." >> "$GITHUB_STEP_SUMMARY"
      - name: Set up read-only Vitest sccache
        id: vitest-sccache-setup
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true
      - name: Start read-only Vitest sccache service
        id: vitest-sccache-start
        if: ${{ steps.vitest-sccache-setup.outcome == 'success' }}
        continue-on-error: true
        env:
          SCCACHE_CLIENT_SIDE: "1"
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_RW_MODE: READ_ONLY
          SCCACHE_GHA_VERSION: relayer-rust-line-tables-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.release }}-${{ steps.rust-toolchain.outputs.host }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
        run: |
          if "$SCCACHE_PATH" --start-server; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Build Vitest runtime prerequisites with read-only sccache
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: node scripts/ci/run-chapter.mjs vitest-prerequisites
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan }}
          RELAYER_SCCACHE_ENABLED: ${{ steps.vitest-sccache-start.outputs.enabled }}
          RUSTC_WRAPPER: ${{ github.workspace }}/scripts/ci/sccache-wrapper.sh
          SCCACHE_CLIENT_SIDE: "1"
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_RW_MODE: READ_ONLY
          SCCACHE_GHA_VERSION: relayer-rust-line-tables-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.release }}-${{ steps.rust-toolchain.outputs.host }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      - name: Build Vitest runtime prerequisites from target cache
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
        run: node scripts/ci/run-chapter.mjs vitest-prerequisites
        env:
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan }}
      - name: Run fresh Vitest and secret-boundary tests
        run: node scripts/ci/run-chapter.mjs vitest
        env:
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan }}
      - name: Report Vitest sccache compiler statistics
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        env:
          SCCACHE_SETUP_OUTCOME: ${{ steps.vitest-sccache-setup.outcome }}
          SCCACHE_START_OUTCOME: ${{ steps.vitest-sccache-start.outcome }}
        run: |
          stats_text="$RUNNER_TEMP/vitest-sccache-stats.txt"
          stats_json="$RUNNER_TEMP/vitest-sccache-stats.json"
          append_summary() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          append_summary "### Vitest read-only sccache canary"
          append_summary "- Setup: $SCCACHE_SETUP_OUTCOME"
          append_summary "- Service start: $SCCACHE_START_OUTCOME"
          append_summary "- Cache access: read-only"
          if [ "$SCCACHE_SETUP_OUTCOME" = "success" ] &&
             [ "$SCCACHE_START_OUTCOME" = "success" ] &&
             [ -n "${SCCACHE_PATH:-}" ]; then
            set +e
            "$SCCACHE_PATH" --show-stats 2>&1 | tee "$stats_text"
            stats_status=${PIPESTATUS[0]}
            "$SCCACHE_PATH" --show-stats --stats-format json > "$stats_json"
            json_status=$?
            set -e
            append_summary "- Text statistics: exit $stats_status"
            append_summary "- JSON statistics: exit $json_status"
            append_summary '```text'
            cat "$stats_text" >> "$GITHUB_STEP_SUMMARY"
            append_summary '```'
          else
            append_summary "- Statistics: unavailable; compilation fell back to direct rustc"
          fi
          append_summary "Compiler objects are untrusted acceleration only; cache reuse never substitutes for fresh mapped Vitest execution."
      - name: Upload Vitest sccache compiler statistics
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vitest-sccache-stats-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vitest-sccache-stats.txt
            ${{ runner.temp }}/vitest-sccache-stats.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Save trusted Vitest runtime compilation acceleration
        if: ${{ github.event_name == 'push' && success() && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  python:
    name: Fresh Python client tests
    needs: [plan, quick]
    if: ${{ needs.quick.result == 'success' && needs.plan.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Run fresh Python tests
        run: node scripts/ci/run-chapter.mjs python
        env:
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan }}

  receipts:
    name: Receipt integrity
    needs: [plan, quick]
    if: ${{ needs.quick.result == 'success' && needs.plan.outputs.receipts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node dependencies with evidence
        uses: ./.github/actions/setup-node-dependencies
      - name: Check receipt integrity
        run: node scripts/ci/run-chapter.mjs receipts
        env:
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan }}

  prd:
    name: PRD readability
    needs: [plan, quick]
    if: ${{ needs.quick.result == 'success' && needs.plan.outputs.prd == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Check PRD readability
        run: node scripts/ci/run-chapter.mjs prd
        env:
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan }}

  full:
    name: Full repository gates
    needs: [plan, quick]
    if: ${{ needs.quick.result == 'success' && needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node dependencies with evidence
        uses: ./.github/actions/setup-node-dependencies
      - name: Identify Rust cache inputs
        id: rust-toolchain
        run: |
          rustc --version --verbose
          echo "release=$(rustc --version --verbose | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "host=$(rustc --version --verbose | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
      - name: Start Rust cache timing
        id: rust-cache-timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Restore full-gate Rust compilation acceleration
        id: rust-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-full-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.release }}-${{ steps.rust-toolchain.outputs.host }}-debug-all-features-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-full-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.release }}-${{ steps.rust-toolchain.outputs.host }}-debug-all-features-v1-
      - name: Record full-gate Rust cache status
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          STARTED: ${{ steps.rust-cache-timing.outputs.started }}
        run: |
          elapsed=$(($(date +%s) - STARTED))
          echo "### Full-gate Rust compilation cache" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact hit: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restore: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          echo "Cache reuse is acceleration, not verification evidence." >> "$GITHUB_STEP_SUMMARY"
      - name: Run repository-required check and build
        run: node scripts/ci/run-chapter.mjs full
        env:
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan }}
      - name: Save trusted full-gate Rust compilation acceleration
        if: ${{ github.event_name == 'push' && success() && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  packaging:
    name: Prime runtime package (${{ matrix.target }})
    needs: [plan, quick]
    if: ${{ needs.quick.result == 'success' && needs.plan.outputs.packaging == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon is the only target smoke-packaged per PR. Intel macOS
          # and Windows x64 are still built at release time by
          # desktop-signed-preview.yml; re-add them here if they need per-PR
          # coverage again.
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node dependencies with evidence
        uses: ./.github/actions/setup-node-dependencies
      - name: Verify Node toolchain
        run: node scripts/check-node-version.mjs
      - name: Identify Rust cache inputs
        id: rust-toolchain
        run: |
          rustc --version --verbose
          echo "release=$(rustc --version --verbose | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "host=$(rustc --version --verbose | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
      - name: Start Rust cache timing
        id: rust-cache-timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Restore packaging Rust compilation acceleration
        id: rust-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-packaging-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.release }}-${{ steps.rust-toolchain.outputs.host }}-debug-default-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-packaging-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.release }}-${{ steps.rust-toolchain.outputs.host }}-debug-default-v1-
      - name: Record packaging Rust cache status
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          STARTED: ${{ steps.rust-cache-timing.outputs.started }}
        run: |
          elapsed=$(($(date +%s) - STARTED))
          echo "### Packaging Rust compilation cache" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact hit: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restore: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Seed the locked Cargo dependency closure
        run: node scripts/ci/run-timed.mjs "Packaging Cargo fetch" cargo fetch --locked --target aarch64-apple-darwin
      - name: Build and inspect the actual target ASAR
        run: node scripts/ci/run-timed.mjs "Apple Silicon packaging" npm run desktop:pack
        env:
          RELAYER_DESKTOP_TARGET: ${{ matrix.target }}
      - name: Save trusted packaging Rust compilation acceleration
        if: ${{ github.event_name == 'push' && success() && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  check:
    name: check
    if: always()
    needs: [plan, quick, rust, typescript, vitest, python, receipts, prd, packaging, full]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Assert every selected required chapter passed
        run: node scripts/ci/assert-required-jobs.mjs
        env:
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}

  ladybug-windows-qualification:
    # Parked while Windows is not a release target. The pinned-source setup below
    # is preserved verbatim so re-enabling is a one-line change. This job has never
    # published a receipt; see docs/evidence/issue-261-ladybug-qualification.md.
    if: ${{ false }}
    name: Ladybug packaged qualification (windows-x64) (blocked)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/check-node-version.mjs
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64
      - run: npm ci
      - name: Seed the locked Cargo dependency closure
        shell: pwsh
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Fetch and prepare pinned Ladybug and static OpenSSL sources
        shell: pwsh
        run: |
          npm run ladybug:source -- fetch --cache "$env:RUNNER_TEMP/ladybug-cache"
          npm run ladybug:source -- prepare --cache "$env:RUNNER_TEMP/ladybug-cache" --output "$env:RUNNER_TEMP/ladybug-prepared" --target x86_64-pc-windows-msvc
      - name: Build, inspect, and exercise packaged Ladybug
        shell: pwsh
        env:
          RELAYER_DESKTOP_TARGET: windows-x64
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/capture-ladybug-packaged-lifecycle.mjs --source-output "$env:RUNNER_TEMP/ladybug-prepared" --source-commit "$env:SOURCE_COMMIT" --receipt-output "$env:RUNNER_TEMP/ladybug-windows-receipt.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ladybug-windows-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ladybug-windows-receipt.json
          if-no-files-found: error
          retention-days: 30
