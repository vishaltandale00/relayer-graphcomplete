name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  prime-runtime-package:
    name: Prime runtime package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon is the only target smoke-packaged per PR. Intel macOS
          # and Windows x64 are still built at release time by
          # desktop-signed-preview.yml; re-add them here if they need per-PR
          # coverage again.
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and inspect the actual target ASAR
        run: npm run desktop:pack
        env:
          RELAYER_DESKTOP_TARGET: ${{ matrix.target }}
