:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);

}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

  min-height: 26px;

  padding: 0 8px;

  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

  background-color: var(--primary);

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);

  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;

  height: 16px;

.form-switch .form-check-input:checked {

  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;

  border-radius: var(--radius-full);

}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

            &lt;button class=&quot;graph-card node-green selected&quot; type=&quot;button&quot; data-force-node=&quot;accepted&quot; data-x=&quot;0.33&quot; data-y=&quot;0.42&quot; aria-label=&quot;Accepted graph commit node&quot;&gt;&lt;span class=&quot;node-icon&quot;&gt;✓&lt;/span&gt;&lt;h4&gt;Accepted graph commit&lt;/h4&gt;&lt;/button&gt;

          &lt;/div&gt;
          &lt;aside class=&quot;node-inspector&quot;&gt;&lt;div class=&quot;inspector-heading&quot;&gt;NODE DETAILS&lt;/div&gt;&lt;div class=&quot;inspector-body&quot;&gt;&lt;div class=&quot;inspector-head&quot;&gt;&lt;span class=&quot;node-icon&quot; style=&quot;color:#38a169;border-color:#38a169&quot;&gt;✓&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Accepted graph commit&lt;/h3&gt;&lt;div class=&quot;inspector-kind&quot;&gt;completion.acceptance&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;inspector-copy&quot;&gt;The response becomes product-visible only after the graph engine validates and submits the run output. A model turn ending does not satisfy this requirement.&lt;/p&gt;&lt;div class=&quot;inspector-meta&quot;&gt;&lt;div&gt;&lt;small&gt;Grounding&lt;/small&gt;&lt;b&gt;docs/completion.md&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;Judge evidence&lt;/small&gt;&lt;b&gt;2 dimensions&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;inline-node-actions&quot;&gt;&lt;button class=&quot;node-action&quot; type=&quot;button&quot; disabled&gt;Explain retry →&lt;/button&gt;&lt;button class=&quot;node-action add-context&quot; type=&quot;button&quot; disabled aria-label=&quot;Attach context&quot;&gt;＋&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/aside&gt;
          &lt;span class=&quot;callout&quot; style=&quot;left:82px;top:280px&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;callout&quot; style=&quot;left:490px;top:75px&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;callout&quot; style=&quot;left:500px;top:345px&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;callout&quot; style=&quot;right:120px;top:420px&quot;&gt;4&lt;/span&gt;
          &lt;div class=&quot;legend&quot;&gt;&lt;div class=&quot;legend-item&quot;&gt;&lt;b&gt;1&lt;/b&gt;&lt;span&gt;&lt;strong&gt;Separate evaluation group&lt;/strong&gt;Replay entries do not mix with ordinary chats or projects.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;legend-item&quot;&gt;&lt;b&gt;2&lt;/b&gt;&lt;span&gt;&lt;strong&gt;Same renderer&lt;/strong&gt;The app resolves the run output through the normal graph-engine read contract.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;legend-item&quot;&gt;&lt;b&gt;3&lt;/b&gt;&lt;span&gt;&lt;strong&gt;Normal graph inspection&lt;/strong&gt;Nodes, connections, breadcrumb, details, and step history remain realistic.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;legend-item&quot;&gt;&lt;b&gt;4&lt;/b&gt;&lt;span&gt;&lt;strong&gt;Write authority absent&lt;/strong&gt;Review mode removes composition, continuation, and mutating actions.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;relayer-product-walkthrough&#x27;);
      if (!root) return;

      const buttons = Array.from(root.querySelectorAll(&#x27;[data-target]&#x27;));
      const screens = Array.from(root.querySelectorAll(&#x27;[data-screen]&#x27;));
      const forceScenes = new WeakMap();

      const initializeForceScene = (screen) =&gt; {
        const area = screen.querySelector(&#x27;.graph-area&#x27;);
        const svg = area?.querySelector(&#x27;[data-force-edges]&#x27;);
        const nodeElements = Array.from(area?.querySelectorAll(&#x27;[data-force-node]&#x27;) || []);
        if (!area || !svg || nodeElements.length === 0) return null;

        const existing = forceScenes.get(screen);
        if (existing) {
          existing.reheat(0.5);
          return existing;
        }

        const nodes = nodeElements.map((element, index) =&gt; ({
          id: element.dataset.forceNode,
          element,
          xRatio: Number(element.dataset.x || 0.5),
          yRatio: Number(element.dataset.y || 0.5),
          x: 0,
          y: 0,
          vx: index % 2 === 0 ? -0.18 : 0.18,
          vy: index &lt; 2 ? -0.12 : 0.12,
          fixed: false,
        }));
        const nodesById = new Map(nodes.map((node) =&gt; [node.id, node]));
        const links = Array.from(svg.querySelectorAll(&#x27;[data-source][data-target]&#x27;))
          .map((line) =&gt; ({ line, source: nodesById.get(line.dataset.source), target: nodesById.get(line.dataset.target) }))
          .filter((link) =&gt; link.source &amp;&amp; link.target);

        let width = 0;
        let height = 0;
        let alpha = 0.9;
        let frame = 0;
        let dragging = null;

        const measure = () =&gt; {
          const nextWidth = area.clientWidth;
          const nextHeight = area.clientHeight;
          if (!nextWidth || !nextHeight) return false;
          const firstMeasure = width === 0 || height === 0;
          const scaleX = firstMeasure ? 1 : nextWidth / width;
          const scaleY = firstMeasure ? 1 : nextHeight / height;
          width = nextWidth;
          height = nextHeight;
          svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
          nodes.forEach((node) =&gt; {
            if (firstMeasure) {
              node.x = width * node.xRatio;
              node.y = height * node.yRatio;
            } else {
              node.x *= scaleX;
              node.y *= scaleY;
            }
          });
          return true;
        };

        const paint = () =&gt; {
          nodes.forEach((node) =&gt; {
            node.element.style.left = `${node.x}px`;
            node.element.style.top = `${node.y}px`;
          });
          links.forEach(({ line, source, target }) =&gt; {
            const sourceY = source.y - 11;
            const targetY = target.y - 11;
            const dx = target.x - source.x;
            const dy = targetY - sourceY;
            const distance = Math.max(1, Math.hypot(dx, dy));
            const inset = 15;
            line.setAttribute(&#x27;x1&#x27;, String(source.x + (dx / distance) * inset));
            line.setAttribute(&#x27;y1&#x27;, String(sourceY + (dy / distance) * inset));
            line.setAttribute(&#x27;x2&#x27;, String(target.x - (dx / distance) * inset));
            line.setAttribute(&#x27;y2&#x27;, String(targetY - (dy / distance) * inset));
          });
        };

        const tick = () =&gt; {
          frame = 0;
          if (!screen.classList.contains(&#x27;active&#x27;) || !width || !height) return;

          const centerX = width * 0.5;
          const centerY = height * 0.57;
          nodes.forEach((node) =&gt; {
            if (node.fixed) return;
            node.vx += (centerX - node.x) * 0.0015 * alpha;
            node.vy += (centerY - node.y) * 0.0012 * alpha;
          });

          for (let i = 0; i &lt; nodes.length; i += 1) {
            for (let j = i + 1; j &lt; nodes.length; j += 1) {
              const a = nodes[i];
              const b = nodes[j];
              let dx = b.x - a.x;
              let dy = b.y - a.y;
              let distance = Math.max(1, Math.hypot(dx, dy));
              const repulsion = Math.min(1.8, 4200 / (distance * distance)) * alpha;
              const nx = dx / distance;
              const ny = dy / distance;
              if (!a.fixed) {
                a.vx -= nx * repulsion;
                a.vy -= ny * repulsion;
              }
              if (!b.fixed) {
                b.vx += nx * repulsion;
                b.vy += ny * repulsion;
              }
              const minimum = 126;
              if (distance &lt; minimum) {
                const push = (minimum - distance) * 0.025 * alpha;
                if (!a.fixed) {
                  a.vx -= nx * push;
                  a.vy -= ny * push;
                }
                if (!b.fixed) {
                  b.vx += nx * push;
                  b.vy += ny * push;
                }
              }
            }
          }

          links.forEach(({ source, target }) =&gt; {
            const dx = target.x - source.x;
            const dy = target.y - source.y;
            const distance = Math.max(1, Math.hypot(dx, dy));
            const spring = (distance - 168) * 0.012 * alpha;
            const nx = dx / distance;
            const ny = dy / distance;
            if (!source.fixed) {
              source.vx += nx * spring;
              source.vy += ny * spring;
            }
            if (!target.fixed) {
              target.vx -= nx * spring;
              target.vy -= ny * spring;
            }
          });

          nodes.forEach((node) =&gt; {
            if (node.fixed) return;
            node.vx *= 0.82;
            node.vy *= 0.82;
            node.x += node.vx;
            node.y += node.vy;
            node.x = Math.max(72, Math.min(width - 72, node.x));
            node.y = Math.max(104, Math.min(height - 40, node.y));
          });
          paint();
          alpha *= 0.982;
          if (alpha &gt; 0.008 || dragging) frame = requestAnimationFrame(tick);
        };

        const reheat = (nextAlpha = 0.65) =&gt; {
          if (!measure()) return;
          alpha = Math.max(alpha, nextAlpha);
          if (!frame) frame = requestAnimationFrame(tick);
        };

        nodes.forEach((node) =&gt; {
          let moved = false;
          node.element.addEventListener(&#x27;pointerdown&#x27;, (event) =&gt; {
            dragging = node;
            moved = false;
            node.fixed = true;
            node.element.classList.add(&#x27;dragging&#x27;);
            node.element.setPointerCapture(event.pointerId);
            reheat(0.9);
          });
          node.element.addEventListener(&#x27;pointermove&#x27;, (event) =&gt; {
            if (dragging !== node) return;
            const bounds = area.getBoundingClientRect();
            node.x = Math.max(72, Math.min(width - 72, event.clientX - bounds.left));
            node.y = Math.max(104, Math.min(height - 40, event.clientY - bounds.top));
            node.vx = 0;
            node.vy = 0;
            moved = true;
            alpha = Math.max(alpha, 0.75);
            paint();
          });
          const endDrag = (event) =&gt; {
            if (dragging !== node) return;
            dragging = null;
            node.element.classList.remove(&#x27;dragging&#x27;);
            if (node.element.hasPointerCapture(event.pointerId)) node.element.releasePointerCapture(event.pointerId);
            reheat(moved ? 0.7 : 0.25);
          };
          node.element.addEventListener(&#x27;pointerup&#x27;, endDrag);
          node.element.addEventListener(&#x27;pointercancel&#x27;, endDrag);
        });

        measure();
        paint();
        const observer = new ResizeObserver(() =&gt; reheat(0.55));
        observer.observe(area);
        const scene = { reheat };
        forceScenes.set(screen, scene);
        reheat(0.9);
        return scene;
      };

      const activate = (name) =&gt; {
        const target = screens.some((screen) =&gt; screen.dataset.screen === name) ? name : &#x27;agent-setup&#x27;;
        buttons.forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.target === target)));
        screens.forEach((screen) =&gt; screen.classList.toggle(&#x27;active&#x27;, screen.dataset.screen === target));
        const activeScreen = screens.find((screen) =&gt; screen.dataset.screen === target);
        if (activeScreen) requestAnimationFrame(() =&gt; initializeForceScene(activeScreen));
        window.top.postMessage({ type: &#x27;relayer:walkthrough-scenario&#x27;, scenario: target }, &#x27;*&#x27;);
      };

      buttons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; activate(button.dataset.target));
      });

      root.querySelectorAll(&#x27;[data-open-eval]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; activate(&#x27;eval-thread&#x27;));
      });
      const openReport = root.querySelector(&#x27;[data-open-report]&#x27;);
      if (openReport) openReport.addEventListener(&#x27;click&#x27;, () =&gt; activate(&#x27;eval-report&#x27;));

      const annotationsToggle = root.querySelector(&#x27;[data-annotations-toggle]&#x27;);
      if (annotationsToggle) {
        annotationsToggle.addEventListener(&#x27;click&#x27;, () =&gt; {
          const visible = root.classList.toggle(&#x27;show-annotations&#x27;);
          annotationsToggle.setAttribute(&#x27;aria-pressed&#x27;, String(visible));
          annotationsToggle.textContent = visible ? &#x27;Hide annotations&#x27; : &#x27;Show annotations&#x27;;
        });
      }

      const pickerButtons = Array.from(root.querySelectorAll(&#x27;[data-picker]&#x27;));
      const pickerPanels = Array.from(root.querySelectorAll(&#x27;[data-picker-panel]&#x27;));
      pickerButtons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const target = button.dataset.picker;
          pickerButtons.forEach((candidate) =&gt; {
            candidate.setAttribute(&#x27;aria-expanded&#x27;, String(candidate.dataset.picker === target));
          });
          pickerPanels.forEach((panel) =&gt; {
            panel.classList.toggle(&#x27;active&#x27;, panel.dataset.pickerPanel === target);
          });
        });
      });

      const contextAnnotation = root.querySelector(&#x27;[data-context-annotation]&#x27;);
      const contextTrigger = contextAnnotation?.querySelector(&#x27;.context-annotation-trigger&#x27;);
      const contextNodes = Array.from(contextAnnotation?.querySelectorAll(&#x27;[data-context-node]&#x27;) || []);
      const contextTitle = contextAnnotation?.querySelector(&#x27;[data-context-title-display]&#x27;);
      const contextNote = contextAnnotation?.querySelector(&#x27;[data-context-note-display]&#x27;);
      if (contextAnnotation &amp;&amp; contextTrigger) {
        contextTrigger.addEventListener(&#x27;click&#x27;, () =&gt; {
          const open = contextAnnotation.classList.toggle(&#x27;open&#x27;);
          contextTrigger.setAttribute(&#x27;aria-expanded&#x27;, String(open));
        });
      }
      contextNodes.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          contextNodes.forEach((candidate) =&gt; {
            candidate.setAttribute(&#x27;aria-pressed&#x27;, String(candidate === button));
          });
          if (contextTitle) contextTitle.textContent = button.dataset.contextTitle || &#x27;&#x27;;
          if (contextNote) contextNote.textContent = button.dataset.contextNote || &#x27;&#x27;;
        });
      });
      activate(&#x27;agent-setup&#x27;);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
